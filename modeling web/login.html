<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Prestige Face Nigeria</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #00A86B;
      --dark-blue: #1e1e2f;
      --darker-blue: #0f0f1a;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      background: radial-gradient(circle at center, var(--dark-blue) 0%, var(--darker-blue) 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-container {
      width: 100%;
      max-width: 450px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
    }

    .login-card h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--gold);
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 35px;
      font-size: 0.9rem;
      text-align: center;
    }

    .input-group { position: relative; margin-bottom: 20px; }

    .input-group i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255, 255, 255, 0.3);
      transition: 0.3s;
    }

    input {
      width: 100%;
      padding: 16px 16px 16px 52px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: #fff;
    }

    input:focus { outline: none; border-color: var(--gold); background: rgba(255, 255, 255, 0.1); }
    input:focus + i { color: var(--gold); }

    .btn-login {
      width: 100%;
      padding: 16px;
      background: var(--gold);
      color: var(--darker-blue);
      border: none;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
      margin-top: 10px;
    }

    .btn-login:hover { background: #fff; transform: translateY(-3px); }

    .options {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      font-size: 0.85rem;
    }

    .options a { color: var(--gold); text-decoration: none; opacity: 0.8; }
    .options a:hover { opacity: 1; text-decoration: underline; }

    footer { 
      margin-top: 30px; 
      text-align: center; 
      font-size: 0.75rem; 
      color: rgba(255,255,255,0.3); 
    }
  </style>
</head>
<body>

  <main class="auth-container">
    <div class="login-card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your Prestige Face account</p>

      <form id="loginForm">
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">Login to Portal</button>
      </form>

      <div class="options">
        <a href="#">Forgot Password?</a>
        <a href="signup.html">Create Account</a>
      </div>

      <footer>EST. 2026 • PRESTIGE FACE</footer>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://gykkocmrjfjocmwjwfst.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_WSvJdtO4jRhbXw4PZexD0w_gBEiCkFT';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      
      btn.innerHTML = 'Logging in...';
      btn.disabled = true;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        alert("Login Error: " + error.message);
        btn.innerHTML = 'Login to Portal';
        btn.disabled = false;
      } else {
        window.location.href = "main.html";
      }
    });
  </script>
</body>
</html>
