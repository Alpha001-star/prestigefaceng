<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Prestige Face Nigeria</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* ==========================================================================
           COLOR PALETTE & DESIGN SYSTEM (Golden Orange & Black Theme)
           ========================================================================== */
    :root {
      --primary: #E67E22;
      /* Vibrant Golden Orange */
      --primary-dark: #D35400;
      /* Deep Burned Golden Orange */
      --black: #0A0A0B;
      /* Pure Obsidian Black */
      --dark: #121214;
      /* Off-Black Charcoal */
      --light-bg: #FAF8F5;
      /* Warm Ivory Light Background */
      --text-dark: #1A1A1A;
      --text-light: #6E6E73;
      /* Editorial Slate Gray */
      --white: #ffffff;
      --border: rgba(230, 126, 34, 0.2);
      --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--light-bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Container designed to match the form wrappers */
    .auth-container {
      width: 100%;
      max-width: 450px;
      background: var(--white);
      border: 1px solid var(--border);
      padding: 50px 40px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
    }

    .login-card h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      font-weight: 700;
      color: var(--black);
      margin-bottom: 8px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .subtitle {
      color: var(--text-light);
      margin-bottom: 35px;
      font-size: 0.9rem;
      text-align: center;
      font-weight: 300;
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      transition: var(--transition);
    }

    input {
      width: 100%;
      padding: 14px 16px 14px 52px;
      background: var(--white);
      border: 1px solid rgba(0, 0, 0, 0.12);
      color: var(--text-dark);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.12);
    }

    input:focus+i {
      color: var(--primary);
    }

    .btn-login {
      width: 100%;
      padding: 16px;
      background: var(--primary);
      color: var(--white);
      border: 1px solid var(--primary);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 10px;
    }

    .btn-login:hover {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
      transform: translateY(-1px);
    }

    .options {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      font-size: 0.85rem;
    }

    .options a {
      color: var(--text-dark);
      text-decoration: none;
      font-weight: 500;
      transition: var(--transition);
    }

    .options a:hover {
      color: var(--primary);
    }

    footer {
      margin-top: 40px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--primary-dark);
      letter-spacing: 2px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <main class="auth-container">
    <div class="login-card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your Prestige Face account</p>

      <form id="loginForm">
        <div class="input-group">
          <input type="email" id="email" placeholder="Email Address" required>
          <i class="fas fa-envelope"></i>
        </div>

        <div class="input-group">
          <input type="password" id="password" placeholder="Password" required>
          <i class="fas fa-lock"></i>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">Login to Portal</button>
      </form>

      <div class="options">
        <a href="#">Forgot Password?</a>
        <a href="signup.html">Create Account</a>
      </div>

      <footer>EST. 2026 • PRESTIGE FACE NIGERIA</footer>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Supabase Client Management
    const SUPABASE_URL = 'https://gykkocmrjfjocmwjwfst.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_WSvJdtO4jRhbXw4PZexD0w_gBEiCkFT';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');

      btn.innerHTML = 'Logging in...';
      btn.disabled = true;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        alert("Login Error: " + error.message);
        btn.innerHTML = 'Login to Portal';
        btn.disabled = false;
      } else {
        window.location.href = "main.html";
      }
    });
  </script>
</body>

</html>
