<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Prestige Face Nigeria</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           COLOR PALETTE & DESIGN SYSTEM (Matches Main Site Architecture)
           ========================================================================== */
        :root {
            --primary: #111111;
            --accent: #c5a880; /* High-Fashion Gold */
            --light-bg: #f9f9f9;
            --text-dark: #222222;
            --text-light: #777777;
            --white: #ffffff;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
        }

        body {
            background-color: var(--light-bg);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Container designed to mimic the crisp layout parameters of the form wrappers */
        .auth-container {
            width: 100%;
            max-width: 450px;
            background: var(--white);
            border: 1px solid #e0e0e0;
            padding: 50px 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .login-card h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 8px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            color: var(--text-light);
            margin-bottom: 35px;
            font-size: 0.9rem;
            text-align: center;
            font-weight: 300;
        }

        .input-group { 
            position: relative; 
            margin-bottom: 20px; 
        }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            transition: var(--transition);
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 52px;
            background: var(--white);
            border: 1px solid #ddd;
            color: var(--text-dark);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }

        input:focus { 
            border-color: var(--primary); 
        }
        
        input:focus + i { 
            color: var(--accent); 
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: var(--white);
            border: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-login:hover { 
            background: var(--accent);
        }

        .options {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 0.85rem;
        }

        .options a { 
            color: var(--text-dark); 
            text-decoration: none; 
            font-weight: 400;
            transition: var(--transition);
        }
        
        .options a:hover { 
            color: var(--accent);
        }

        footer { 
            margin-top: 40px; 
            text-align: center; 
            font-size: 0.75rem; 
            color: var(--text-light); 
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

  <main class="auth-container">
    <div class="login-card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Sign in to your Prestige Face account</p>

      <form id="loginForm">
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Password" required>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">Login to Portal</button>
      </form>

      <div class="options">
        <a href="#">Forgot Password?</a>
        <a href="signup.html">Create Account</a>
      </div>

      <footer>EST. 2026 • PRESTIGE FACE NIGERIA</footer>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Supabase Client Management
    const SUPABASE_URL = 'https://gykkocmrjfjocmwjwfst.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_WSvJdtO4jRhbXw4PZexD0w_gBEiCkFT';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      
      btn.innerHTML = 'Logging in...';
      btn.disabled = true;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        alert("Login Error: " + error.message);
        btn.innerHTML = 'Login to Portal';
        btn.disabled = false;
      } else {
        window.location.href = "main.html";
      }
    });
  </script>
</body>
</html>
